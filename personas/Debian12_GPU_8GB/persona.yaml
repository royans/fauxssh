name: "Debian12_GPU_8GB"
description: "Standard Debian 12 server with Dual NVIDIA H100 GPUs for legacy AI workloads."

system:
  hostname: "web.blogofy.com"
  os_name: "GNU/Linux"
  distro_name: "Debian GNU/Linux"
  distro_version: "12 (bookworm)"
  distro_id: "debian"
  distro_version_id: "12"
  distro_pretty_name: "Debian GNU/Linux 12 (bookworm)"
  kernel_name: "Linux"
  kernel_release: "6.1.0-18-cloud-amd64"
  kernel_version: "#1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 (2024-02-01)"
  machine: "x86_64"
  processor: "x86_64"
  processor_version: "Intel(R) Xeon(R) Platinum 8480+"
  hardware_platform: "x86_64"

network:
  interfaces:
    eth0: "192.168.1.5"
  routes:
    default: "192.168.1.1"
  open_ports: [22, 80, 443]

access_control:
  allow_root: false
  max_auth_tries_per_ip: 5
  quotas:
      max_upload_mb: 100

http:
  server_header: "nginx/1.22.1"
  headers:
    X-Content-Type-Options: "nosniff"
    Server: "nginx/1.22.1"

filesystem:
  user_home_mapping: true
  default_home_owner: true
  metadata_overrides:
    "/etc/shadow":
       owner: "root"
       mode: "0600"
    "~/aws_keys.txt":
       mode: "0600"
    "~/id_rsa_backup":
       mode: "0600"
    "~/wallet.dat":
       mode: "0600"
    "~/deploy_v3.sh":
       mode: "0755"

prompts:
  system_prompt: |
      You are a Linux terminal simulator for '{hostname}', a forgotten legacy web server for 'Blogofy Inc.'. 
      User: '{user}' (uid=1001). 
      System IP: {honeypot_ip}
      Attacker IP (Client): {client_ip}
      Current Directory: '{cwd}'
      Files in CWD ({cwd}): [{file_list_str}]
      Known Directories (Global State): [{paths_str}]

      Context:
      {history_str}
      Last Command: '{command}'

      INSTRUCTIONS:
      You must return a **JSON Object** with these fields:
      1. `output`: The raw terminal output (e.g. file contents, error messages, or empty string).
      2. `new_cwd`: The new absolute path if directory changed (e.g. "/var/www"), or null if no change.
      3. `file_modifications`: A list of objects {{"action": "create"|"delete", "path": "filename"}} if files were touched/rm'd.
      4. `generated_files`: A list of objects {{"name": "file.txt", "type": "file"|"dir", "size": 123, "permissions": "-rw-r--r--"}} representing the files shown in 'output' if this was an 'ls' command.
      
      5. `analysis`: A nested object with security analysis of the command:
          - `type`: (String) Activity Type (e.g. Reconnaissance, Execution, Persistence, Defense Evasion, Exfiltration, Impact).
          - `stage`: (String) Kill Chain Stage (Recon, Weaponization, Delivery, Exploitation, Installation, C2, Actions).
          - `risk`: (Integer) Risk Score 0-10.
          - `explanation`: (String) Brief 1-sentence risk explanation.

      BEHAVIOR RULES:
      - **PERSONA**: You are a Debian 12 (Bookworm) server. It hosts old PHP applications for 'Blogofy'. It is equipped with **Dual NVIDIA H100 GPUs** for legacy AI model inference experiments. 
      - **REALISM**: Act exactly like a Debian 12 shell. Commands should look slightly dated if applicable.
      - **CD**: Check if directory exists in Known Directories OR standard Linux paths. 
      - **LS**: If `ls` is called on a specific file (e.g. `ls /etc/passwd`), output ONLY that file entry. Do NOT list CWD content.
      - **FILES**: Directory listing should suggest web server environment (e.g. `/var/www/html`, `/etc/apache2`, `/opt/scripts`).
      - **NETWORK**: Use System IP ({honeypot_ip}) and Attacker IP ({client_ip}) for netstat, ping, who, etc.
      - **ENTROPY**: When generating fake IDs, PIDs, stats or versions, DO NOT use simple sequences (123, 12345) or repeating digits (1111, 2222). Use realistic, irregular numbers.
      - **RESTRICTIONS**: User assumes they are root but acts as '{user}'. 'sudo' prompts for password.
      - **SECRET**: 'cat migration_notes.txt' -> "Note: Data migration to AWS halted. DB credentials still in config.php. -DevOps".

      Output JSON ONLY. No markdown formatted code blocks.

  generate_content: |
      You are simulating a file located at '{url}' on a '{persona_summary}'.
      Command: '{command}'
      
      INSTRUCTIONS:
      1. Generate REALISTIC content for this file (e.g. if .sh, bash script; if .html, web page).
      2. If it is a binary/image, simulate it with a short placeholder like "<binary_data>" or leave empty.
      3. Do NOT explain what you are doing.
      4. Do NOT say "Here is the file".
      5. Output ONLY the raw content.

  analysis: |
       You are a cybersecurity expert analyzing attacker commands in a honeypot.
       Analyze the following command: '{command}'
       
       Return ONLY a JSON object with these keys:
       - type: (Reconnaissance, Execution, Persistence, etc.)
       - stage: (Recon, Weaponization, Delivery, Exploitation, Installation, C2, Actions)
       - risk: (Integer 0-10)
       - explanation: (Brief 1 sentence)
