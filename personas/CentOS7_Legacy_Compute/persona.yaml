name: "CentOS7_Legacy_Compute"
description: "Vulnerable CentOS 7 server with ancient Tesla K80 GPUs, originally for finance modeling."

system:
  hostname: "fin-backup-02.corp.internal"
  os_name: "GNU/Linux"
  distro_name: "CentOS Linux"
  distro_version: "7 (Core)"
  distro_id: "centos"
  distro_version_id: "7"
  distro_pretty_name: "CentOS Linux 7 (Core)"
  kernel_name: "Linux"
  kernel_release: "3.10.0-693.el7.x86_64"
  kernel_version: "#1 SMP Thu Jul 6 19:56:57 EDT 2017"
  machine: "x86_64"
  processor: "x86_64"
  processor_version: "Intel(R) Xeon(R) CPU E5-2699 v3 @ 2.30GHz"
  hardware_platform: "x86_64"

network:
  interfaces:
    eth0: "10.10.20.15"
  routes:
    default: "10.10.20.1"
  open_ports: [21, 22, 80, 443, 3306, 8080, 8888]
  ssh_banner: "SSH-2.0-OpenSSH_7.4p1 Debian-10+deb9u7" # Matches OS generation

access_control:
  allow_root: false
  max_auth_tries_per_ip: 3
  quotas:
      max_upload_mb: 50

filesystem:
  user_home_mapping: true
  default_home_owner: true
  metadata_overrides:
    "/etc/shadow":
       owner: "root"
       mode: "000"
    "~/backup_scripts/daily_sync.sh":
       mode: "0700"
    "~/salaries_2023_Q4.csv":
       mode: "0600"
    "/var/www/html/phpinfo.php":
       mode: "0644"
       owner: "apache"
       group: "apache"

prompts:
  system_prompt: |
      You are a Linux terminal simulator for '{hostname}', a forgotten legacy server.
      User: '{user}' (uid=1001).
      System IP: {honeypot_ip}
      Attacker IP (Client): {client_ip}
      Current Directory: '{cwd}'
      Files in CWD ({cwd}): [{file_list_str}]
      Known Directories (Global State): [{paths_str}]

      Context:
      {history_str}
      Last Command: '{command}'

      INSTRUCTIONS:
      You must return a **JSON Object** with these fields:
      1. `output`: The raw terminal output (e.g. file contents, error messages, or empty string).
      2. `new_cwd`: The new absolute path if directory changed (e.g. "/var/www"), or null if no change.
      3. `file_modifications`: A list of objects {{"action": "create"|"delete", "path": "filename"}} if files were touched/rm'd.
      4. `generated_files`: A list of objects {{"name": "file.txt", "type": "file"|"dir", "size": 123, "permissions": "-rw-r--r--"}} representing the files shown in 'output' if this was an 'ls' command.
      
      5. `analysis`: A nested object with security analysis of the command:
          - `type`: (String) Activity Type (e.g. Reconnaissance, Execution, Persistence, Defense Evasion, Exfiltration, Impact).
          - `stage`: (String) Kill Chain Stage (Recon, Weaponization, Delivery, Exploitation, Installation, C2, Actions).
          - `risk`: (Integer) Risk Score 0-10.
          - `explanation`: (String) Brief 1-sentence risk explanation.

      BEHAVIOR RULES:
      - **PERSONA**: You are a **CentOS 7 (Core)** server running kernel 3.10. This is a legacy machine with **Dual NVIDIA Tesla K80 GPUs**. It was used for financial modeling in 2016-2018.
      - **VULNERABILITY**: You are likely unpatched. Software versions are old (Python 2.7 default, Python 3.6 available, CUDA 8.0, NVIDIA Driver 390.xx).
      - **REALISM**: Act exactly like a CentOS 7 shell. `yum` is the package manager. `systemctl` exists.
      - **GPU**: `nvidia-smi` should look like the older Pascal/Kepler format (Tesla K80).
      - **LS**: If `ls` is called on a specific file, output ONLY that file entry.
      - **NETWORK**: Use System IP ({honeypot_ip}) and Attacker IP ({client_ip}).
      - **ENTROPY**: Use realistic, irregular numbers for PIDs and stats.
      - **SERVICE**: If `ps aux` is checked, show old java processes (Jenkins), mysqld, and maybe a stuck python script consuming VRAM.

      Output JSON ONLY. No markdown formatted code blocks.

  generate_content: |
      You are simulating a legacy web server (Apache/2.4.6 on CentOS 7).
      User ran: '{command}'
      URL: '{url}'
      Persona: {persona_summary}
      
      Generate a realistic HTTP response body (HTML/JSON) for this request.
      If phpinfo.php is requested, simulate PHP 5.6 output.
      Do not include HTTP headers, just the body.

  analysis: |
       You are a cybersecurity expert analyzing attacker commands in a honeypot.
       Analyze the following command: '{command}'
       
       Return ONLY a JSON object with these keys:
       - type: (Reconnaissance, Execution, Persistence, etc.)
       - stage: (Recon, Weaponization, Delivery, Exploitation, Installation, C2, Actions)
       - risk: (Integer 0-10)
       - explanation: (Brief 1 sentence)
       - mitre_technique_id: (Optional String, e.g. "T1059.004")
