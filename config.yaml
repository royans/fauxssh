server:
  hostname: "web.blogofy.com"
  #port: 2222
  port: 15022
  banner_default: "SSH-2.0-OpenSSH_8.4p1 Debian-5+deb11u1"

logging:
  level: INFO
  json_log_file: "events.json.log"
  enable_session_replay: false
  modules:
    ssh_honeypot.services.mysql: INFO
    ssh_honeypot.core.llm: DEBUG
  centralized:
    enabled: true
    mode: "local"         # Options: [local, zmq, both]
    server_name: ""       # Leave empty to use system hostname
    batch_size: 50
    batch_timeout: 10
    compression: true
    # ZeroMQ / Remote Settings (Configure via .env)
    zmq_url: "tcp://127.0.0.1:5555"
    zmq_user: "admin"
    zmq_pass: ""

realism:
  latency:
    enabled: true
    min_ms: 20
    max_ms: 300


database:
  type: "sqlite" # or "postgres"
  postgres:
    host: "localhost"
    port: 5432
    user: "honeypot"
    password: "" # ENV: DATABASE_POSTGRES_PASSWORD
    dbname: "logs"

virustotal:
  enabled: false
  api_key: "" # ENV: VIRUSTOTAL_API_KEY
  upload_files: true
  min_file_size: 500

analytics:
  ignore_ips: [] # ENV: ANALYTICS_IGNORE_IPS (comma-separated)
  show_empty_sessions: false
  batch_size: 10
  # Which services should have their commands/requests analyzed by LLM (Risk detection)
  # Default: ssh, telnet, mysql. HTTP is disabled by default to reduce token usage and noise.
  enabled_services:
    - "ssh"
    - "telnet"
    - "mysql"
    - "redis"
    - "llm-api"
    - "mcp"
    # - "http"

alerting:
  webhook_url: "" # ENV: ALERTING_WEBHOOK_URL
  notify_threshold: 80
  session_threshold: 95
  ip_threshold: 99
  keywords: []

telnet:
  enabled: true
  #port: 2323
  port: 15023
  
redis:
  enabled: true
  port: 6379

mysql:
  enabled: true
  port: 3306
  auth:
    allow_any: true
    allow_any_rate: 1.0 # Allow everything during test/debug
    weak_passwords:
      - "root:root"
      - "admin:admin"
      - "test:test"


mcp:
  enabled: true
  port: 8001
  max_llm_calls: 20
  throttle_delay: 2.0

llm:
  provider: "google" # Options: [google, openai, ollama]
  model_name: "gemma-3-27b-it"
  api_key: "" # ENV: LLM_API_KEY
  force_ipv4: true

llm_api:
  ollama:
    enabled: true
    port: 11434
    fake_models:
      - "llama3:latest"
      - "llama3:70b"
      - "mistral:latest"
      - "mixtral:8x7b"
      - "codellama:latest"
      - "phi3:latest"
      - "neural-chat:latest"
      - "starling-lm:latest"
      - "yi:latest"
      - "gemma:2b"
      - "gemma:7b"
  openai:
    enabled: true
    port: 8000

http:
  enabled: true
  #port: 8080
  port: 15080
  server_header: "Apache/2.4.52 (Ubuntu)"
  showstats: true
  headers:
    X-Content-Type-Options: "nosniff"
    X-Frame-Options: "DENY"
  web_root: "/var/www/html"
  llm_rpm: 4
  llm_rpd: 20

imap:
  enabled: true
  port: 15143
  ssl_port: 15993
  persona_banners: true

security:
  max_input_length: 50000
  max_input_tokens: 4000
  max_rpm: 60
  bypass_auth_for_ignored_ips: false

throttling:
  dos:
    rpm: 12
    rph: 50
    rpd: 100
  llm:
    rpm: 10
    rph: 50
    rpd: 100

  # Global API limits (25% of Free Tier)
  global:
    google_llm:
      rpm: 30   # Increased from 10 to allow background analysis to succeed
      rph: 400
      rpd: 10000
    ip_api:
      rpm: 10
      rph: 200
      rpd: 1000
    virustotal:
      rpm: 1
      rph: 30
      rpd: 125
